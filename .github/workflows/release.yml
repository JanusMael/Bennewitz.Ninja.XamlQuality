name: Release

# Triggered by a version tag (v1.2.3), or dispatched by hand.
#
# ⛔ A PUBLISHED NUGET VERSION CAN NEVER BE REPLACED. Everything this repository otherwise
# treats as recoverable becomes permanent past the push step, so the gates below — build,
# test, pack — all run before it, and --skip-duplicate makes a re-run of a completed release
# a no-op rather than a failure.

on:
  push:
    tags:
      - 'v*.*.*'
  # Two dispatch modes, decided by whether `version` is filled in:
  #
  #   BLANK    credential preflight — logs in to NuGet.org and stops. Proves the trusted-
  #            publishing policies, the id-token permission and the NUGET_USER variable all line
  #            up, WITHOUT cutting a release. Run this before the first tag.
  #   FILLED   a real release, which is the path to use when a tag already exists.
  #
  # ⚠ The preflight has to live in THIS workflow rather than one of its own: the OIDC token is
  # bound to the workflow FILENAME, so a policy naming release.yml would never match a run of
  # any other file. Every publishing step below is gated on RELEASING, so a preflight cannot
  # publish by accident.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2026.3.920). LEAVE BLANK to only preflight credentials.'
        required: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for NuGet.org Trusted Publishing (OIDC) — see the NuGet/login step below.
      # ⭐ This is what replaces a long-lived API key: the token is minted per run and expires,
      # so there is no secret in this repository that would still be valid if it leaked.
      id-token: write

    env:
      # Trusted publishing carries no secret to leak — this is only the nuget.org profile name
      # the OIDC token is exchanged against, and a profile name is public.
      #
      # ⛔ Storing it as a secret actively costs you the one thing you need when it is wrong.
      # GitHub masks a secret in logs, so a bad value turns nuget.org's already-ambiguous 401 into
      #     No matching trust policy owned by user '***' was found
      # which hides whether the value was a username, an email, or — the natural mistake, given
      # the push below takes --api-key — an API key. That masking cost six blind preflight runs on
      # 2026-09-21 in a sibling repository before the value was simply read out loud. As a
      # variable the error names it. Set it with:
      #     gh variable set NUGET_USER --body <your-nuget.org-profile-name>
      #
      # Read at JOB level so the steps below can test it. (A secret could not be tested in a
      # step's own `if` at all; a variable can, but the job-level read keeps one home for it.)
      NUGET_USER: ${{ vars.NUGET_USER }}
      # A tag push is always a release; a dispatch is one only when a version was supplied.
      RELEASING: ${{ github.event_name == 'push' || inputs.version != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The version comes from the TAG, not from a file, so the tag and the package agree by
      # construction rather than by someone remembering to bump both.
      - name: Resolve version and tag
        if: env.RELEASING == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "TAG=v${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      # ⛔ Fail LOUDLY rather than publish nothing quietly. Without this, a tag with the variable
      # unset skips the push (which is gated on NUGET_USER) but still creates the GitHub Release
      # below — a green run, a release page, and no package. That false green is worse than a
      # failure, because the next person reads the release as evidence the package shipped.
      - name: Refuse to release without NUGET_USER
        if: env.RELEASING == 'true' && env.NUGET_USER == ''
        run: |
          echo "::error::NUGET_USER is not set. Refusing to release: the push would be skipped"
          echo "::error::and a GitHub Release would be created for a package that never shipped."
          exit 1

      - name: Build
        if: env.RELEASING == 'true'
        run: dotnet build XamlQuality.slnx -c Release --nologo -warnaserror /p:Version=${{ env.VERSION }}

      - name: Test
        if: env.RELEASING == 'true'
        run: dotnet test --solution XamlQuality.slnx --no-build -c Release

      - name: Pack
        if: env.RELEASING == 'true'
        run: >
          dotnet pack XamlQuality.slnx -c Release --no-build --nologo
          /p:Version=${{ env.VERSION }}
          --output ./packages/Release

      # Kept immediately before the push: the token this returns is short-lived, and a slow step
      # in between is how it expires before it is used.
      - name: NuGet Login (Trusted Publishing)
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # ⚠ A successful login proves only that AT LEAST ONE policy matched. It cannot prove both
      # exist, because the exchange is per-account, not per-package — so the ids are printed here
      # to be checked by eye against https://www.nuget.org/account/trustedpublishing. A missing
      # second policy is the one failure that leaves the two packages at DIFFERENT versions, and
      # a published version cannot be replaced.
      - name: Report the preflight result
        if: env.RELEASING != 'true'
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not set, so no publish would happen on a tag."
            exit 1
          fi
          echo "Logged in to NuGet.org as '$NUGET_USER'. Tagging will publish."
          {
            echo "### Trusted publishing verified"
            echo "Logged in as \`$NUGET_USER\`. A \`v*.*.*\` tag will publish these ids:"
            echo ""
            echo "- \`Bennewitz.Ninja.XamlQuality\`"
            echo "- \`Bennewitz.Ninja.XamlQuality.ThemeAudit\`"
            echo ""
            echo "⚠ Login proves *a* policy matched — never that it covers every id above."
            echo "Confirm ONE policy whose Glob Patterns cover both, and NOT a policy per id:"
            echo "one exchange mints one key scoped to one policy, so a second policy is never"
            echo "consulted and its package is rejected 403 — after the first is already permanent."
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ Packages are named EXPLICITLY, never globbed. A glob publishes whatever happens to be
      # in the folder, and a published version is permanent — so the one time it picks up
      # something unintended is the one time it cannot be undone.
      #
      - name: Push to NuGet.org
        if: env.RELEASING == 'true' && env.NUGET_USER != ''
        run: |
          dotnet nuget push \
            ./packages/Release/Bennewitz.Ninja.XamlQuality.${{ env.VERSION }}.nupkg \
            ./packages/Release/Bennewitz.Ninja.XamlQuality.ThemeAudit.${{ env.VERSION }}.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ⚠ NAMED HERE TOO, for the same reason as the push above — and the reasoning that says a glob
      # is fine here is the reasoning worth distrusting. "Both packed ids are pushable" is true of
      # today's project list, not of the first release that adds a packable project; that one would
      # be attached to a release nobody chose it for. The failure is also QUIETER than the nuget.org
      # one: a release asset can be deleted, so it never teaches the lesson permanently, it just
      # ships something silently. ReleaseWorkflowTests fails if a glob returns to this file.
      - name: Create GitHub Release
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" \
            --title "${{ env.TAG }}" \
            --generate-notes \
            ./packages/Release/Bennewitz.Ninja.XamlQuality.${{ env.VERSION }}.nupkg \
            ./packages/Release/Bennewitz.Ninja.XamlQuality.ThemeAudit.${{ env.VERSION }}.nupkg
